<VirtualHost *:80>
	ServerName asu3.asu.ia.pw.edu.pl
	DocumentRoot /var/www/asu3
	<Directory /var/www/asu3>
		Options +Includes
		AddType text/html .shtml
		AddOutputFilter INCLUDES .shtml
		DirectoryIndex index.shtml
		AuthType Basic
		AuthName "asu3"
		AuthBasicProvider ldap
		AuthLDAPURL "ldap://localhost/dc=asu,dc=ia,dc=pw,dc=edu,dc=pl?uid"
		Require valid-user
	</Directory>
</VirtualHost>
