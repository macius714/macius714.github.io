<VirtualHost *:80>
	ServerName asu2.asu.ia.pw.edu.pl
	DocumentRoot /var/www/asu2
	<Directory /var/www/asu2>
		Options +Includes
		AddType text/html .shtml
		AddOutputFilter INCLUDES .shtml
		DirectoryIndex index.shtml
		AuthType Basic
		AuthName "asu2"
		AuthUserFile /var/www/htpasswd
		Require valid-user
	</Directory>
</VirtualHost>
